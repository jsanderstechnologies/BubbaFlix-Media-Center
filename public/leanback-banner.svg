<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Curve path optimized for 320x180 Leanback banner dimensions -->
    <path id="leanback-curve" d="M 16,128 Q 160,76 304,128" fill="none" />

    <!-- Rich 3D cinematic red gradient -->
    <linearGradient id="leanback-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="35%" stop-color="#e50914" />
      <stop offset="75%" stop-color="#b30000" />
      <stop offset="100%" stop-color="#7a0000" />
    </linearGradient>

    <!-- Deep solid backing gradient for 3D offset shadow layer -->
    <linearGradient id="leanback-shadow-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b0000" />
      <stop offset="100%" stop-color="#140000" />
    </linearGradient>

    <!-- Metallic border ring gradient -->
    <linearGradient id="leanback-card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#2a0000" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e50914" stop-opacity="0.6" />
    </linearGradient>

    <!-- Ambient backlight filter: smooth two-layer bloom (solid-color blur, no alpha clipping) -->
    <filter id="leanback-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur-wide" />
      <feFlood flood-color="#ff1a1a" flood-opacity="0.55" result="color-wide" />
      <feComposite in="color-wide" in2="blur-wide" operator="in" result="glow-wide" />

      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur-tight" />
      <feFlood flood-color="#ff3030" flood-opacity="0.8" result="color-tight" />
      <feComposite in="color-tight" in2="blur-tight" operator="in" result="glow-tight" />

      <feMerge>
        <feMergeNode in="glow-wide" />
        <feMergeNode in="glow-tight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Card Base for Android TV Launcher -->
  <rect x="4" y="4" width="312" height="172" rx="20" fill="#08080c" stroke="url(#leanback-card-border)" stroke-width="2.5" />

  <!-- Subtle Radial Backlight Pulse -->
  <circle cx="160" cy="90" r="110" fill="#e50914" opacity="0.12" filter="blur(25px)" />

  <!-- BACKGROUND GLOW LAYER -->
  <text
    font-family="'Bebas Neue', 'Impact', 'Arial Black', sans-serif"
    font-size="44"
    font-weight="900"
    fill="#ff1a1a"
    letter-spacing="0.5px"
    filter="url(#leanback-glow)"
    opacity="0.85"
  >
    <textPath href="#leanback-curve" startOffset="50%" text-anchor="middle">
      BUBBAFLIX
    </textPath>
  </text>

  <!-- 3D SHADOW LAYER -->
  <text
    font-family="'Bebas Neue', 'Impact', 'Arial Black', sans-serif"
    font-size="44"
    font-weight="900"
    fill="url(#leanback-shadow-gradient)"
    stroke="#000000"
    stroke-width="1.5"
    stroke-linejoin="round"
    letter-spacing="0.5px"
    dx="1.5"
    dy="2.0"
  >
    <textPath href="#leanback-curve" startOffset="50%" text-anchor="middle">
      BUBBAFLIX
    </textPath>
  </text>

  <!-- FOREGROUND MAIN LOGO LAYER -->
  <text
    font-family="'Bebas Neue', 'Impact', 'Arial Black', sans-serif"
    font-size="44"
    font-weight="900"
    fill="url(#leanback-gradient)"
    stroke="#ffffff"
    stroke-width="0.3"
    stroke-opacity="0.5"
    letter-spacing="0.5px"
  >
    <textPath href="#leanback-curve" startOffset="50%" text-anchor="middle">
      BUBBAFLIX
    </textPath>
  </text>
</svg>
